[package]
name = "ojo-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Inspect, verify and manipulate portable .ojo databases"
repository = "https://github.com/oojuro/oojuro"
publish = false

[[bin]]
name = "ojo"
path = "src/main.rs"

[features]
default = ["archive"]
archive = ["ojo/archive"]

[dependencies]
ojo = { path = "../ojo" }
serde_json.workspace = true
