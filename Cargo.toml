[workspace]
# Minimal file engine by default; compatibility libraries and comparisons stay explicit.
default-members = ["crates/ojo"]
members = [
    "crates/ojo",
    "crates/oojuro-engine",
    "crates/oojuro-bench",
    "crates/oojuro-core",
    "crates/oojuro-nine",
    "crates/oojuro-rank",
    "crates/oojuro-store",
    "crates/oojuro-trace",
    "crates/oojuro-tracebench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/oojuro/oojuro"

[workspace.dependencies]
oojuro-core = { path = "crates/oojuro-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
crc32fast = "1"

[profile.dev]
debug = 0

[profile.test]
debug = 0
