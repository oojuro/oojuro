[package]
name = "oojuro-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Append-only compressed original store for agent text (hot + archive tiers)."

[features]
# Comparison codecs used only by the codec leaderboard binary.
baselines = ["dep:oojuro-nine", "dep:rusqlite", "dep:tantivy", "dep:postgres"]
codecs = ["dep:brotli", "dep:liblzma", "dep:bzip2", "dep:libdeflater", "dep:snap", "dep:lz4", "dep:ppmd-rust", "dep:fsst-rs", "dep:tiktoken-rs", "dep:fm-index"]

[dependencies]
blake3.workspace = true
chacha20poly1305 = "0.10"
crc32fast.workspace = true
lz4_flex.workspace = true
zstd = { version = "0.13", default-features = false, features = ["experimental", "zdict_builder"] }
serde_json.workspace = true
brotli = { version = "8", optional = true }
liblzma = { version = "0.4", optional = true, features = ["static"] }
bzip2 = { version = "0.6", optional = true }
libdeflater = { version = "1", optional = true }
snap = { version = "1", optional = true }
lz4 = { version = "1", optional = true }
ppmd-rust = { version = "1", optional = true }
fsst-rs = { version = "0.5", optional = true }
fastcdc = "3"
tiktoken-rs = { version = "0.7", optional = true }
fm-index = { version = "0.3", optional = true }
oojuro-nine = { path = "../oojuro-nine", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
tantivy = { version = "=0.27.0", default-features = false, features = ["mmap", "lz4-compression", "zstd-compression"], optional = true }
postgres = { version = "0.19", optional = true }

[[bin]]
name = "codecs"
required-features = ["codecs"]

[[bin]]
name = "baselines"
required-features = ["baselines"]

[[bin]]
name = "dedupe-exp"
required-features = ["codecs"]
