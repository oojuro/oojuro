[package]
name = "ojo"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Embedded database for durable .ojo key/value and timestamped event journals"
repository = "https://github.com/oojuro/oojuro"
publish = false

[features]
default = []
archive = ["dep:zstd"]
bench = ["dep:rusqlite", "dep:serde_json"]

[dependencies]
chacha20poly1305 = "0.10.1"
crc32fast = "1"
getrandom = "0.3.4"
sha2 = "0.10.9"
zstd = { version = "0.13.3", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
libc = "0.2"

[[example]]
name = "acid_bench"
required-features = ["bench"]

[[example]]
name = "io_profile"
required-features = ["bench", "archive"]

[[example]]
name = "event_bench"
required-features = ["bench", "archive"]
