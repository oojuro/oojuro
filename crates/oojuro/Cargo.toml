[package]
name = "oojuro"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native local journal CLI and scoped hosted capture/history clients"

[[bin]]
name = "oojuro"
path = "src/bin/oojuro.rs"

[[bin]]
name = "oojuro-native"
path = "src/bin/oojuro-native.rs"

[dependencies]
base64 = "0.22"
oojuro-engine = { path = "../oojuro-engine" }
blake3.workspace = true
oojuro-capture = { path = "../oojuro-capture" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
regex = "1"
libc = "0.2"
flate2 = "1"
