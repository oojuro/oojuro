name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.99.1

jobs:
  ojo:
    name: Minimal file engine, ACID and archive compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
      - name: Test raw core and compressed archive feature
        run: |
          cargo +"$RUST_TOOLCHAIN" test --locked -p ojo
          cargo +"$RUST_TOOLCHAIN" test --locked -p ojo --features archive

  storage:
    name: Legacy engine and shared storage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
      - name: Prepare private test scratch
        run: mkdir -p -m 700 "$RUNNER_TEMP/oojuro-tests"
      - name: Check minimal engine dependency policy
        run: RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN" python3 scripts/dependency_audit.py --engine-only --check --output "$RUNNER_TEMP/engine-dependency-audit.json"
      - name: Check dependency policy refusal cases
        run: python3 scripts/test_dependency_audit.py
      - name: Test legacy engine, storage recovery and sealed frames
        env:
          TMPDIR: ${{ runner.temp }}/oojuro-tests
        run: cargo +"$RUST_TOOLCHAIN" test --locked --no-default-features --lib --tests -p oojuro-core -p oojuro-store -p oojuro-nine

  native:
    name: Native engine and ranking
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
      - name: Prepare private test scratch
        run: mkdir -p -m 700 "$RUNNER_TEMP/oojuro-tests"
      - name: Test native authority, retrieval, accounting and rank conformance
        env:
          TMPDIR: ${{ runner.temp }}/oojuro-tests
        run: cargo +"$RUST_TOOLCHAIN" test --locked --no-default-features --lib --tests -p oojuro-engine -p oojuro-rank -- --test-threads=1

  trace:
    name: Legacy trace storage compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
      - name: Prepare private test scratch
        run: mkdir -p -m 700 "$RUNNER_TEMP/oojuro-tests"
      - name: Test legacy storage and frozen-format compatibility
        env:
          TMPDIR: ${{ runner.temp }}/oojuro-tests
        run: cargo +"$RUST_TOOLCHAIN" test --locked --no-default-features --lib --tests -p oojuro-trace
