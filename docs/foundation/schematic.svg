<path d="M610,376 L610,450" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M610,526 L610,600" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M610,676 L610,720" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1045,226 L1045,300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M780,188 L880,188" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M1045,376 L1045,450" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M185,580 L185,388" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="882" y="590" font-family="sans-serif" font-size="15" fill="#9a3412">No HA / live cutover verified.</text><text x="882" y="615" font-family="sans-serif" font-size="15" fill="#9a3412">New S3 commit protocol required</text><text x="882" y="640" font-family="sans-serif" font-size="15" fill="#9a3412">before S3 becomes live authority.</text></svg>