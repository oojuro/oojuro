[package]
name = "ojo-tools"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Inspect, search and manipulate portable .juro databases"
repository = "https://github.com/oojuro/oojuro"
publish = false

[[bin]]
name = "ojo"
path = "src/main.rs"

[features]
default = ["archive", "search"]
archive = ["ojo/archive"]
search = ["dep:oojuro-engine", "dep:sha2"]

[dependencies]
ojo = { path = "../ojo" }
serde_json.workspace = true
oojuro-engine = { path = "../oojuro-engine", optional = true }
sha2 = { version = "0.10.9", optional = true }
