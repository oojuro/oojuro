[package]
name = "oojuro-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Oojuro foundation: sealed raw/parsed authority and native lexical retrieval."

[dependencies]
oojuro-rank = { path = "../oojuro-rank" }
oojuro-store = { path = "../oojuro-store" }
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
rust-stemmers = "=1.2.0"
ring = "=0.17.14"
aho-corasick = "1"
zstd = { version = "0.13.3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Opt-in actual-file projection diagnostics; never a runtime engine dependency.
ojo = { path = "../ojo", features = ["archive"] }
oojuro-nine = { path = "../oojuro-nine" }
oojuro-core = { path = "../oojuro-core" }
oojuro-trace = { path = "../oojuro-trace" }
